# "lab" profile: PWA test lab. Run with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=lab
# Logs go to the console and to logs/fat-fish-api-lab.log.
logging.file.name=logs/fat-fish-api-lab.log

# One line per request (method, path, status, time, sizes and heap): RequestTimingFilter
logging.level.fatfish.lab.http=INFO

# SQL sent to PostgreSQL and the values bound to each statement
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Per-transaction metrics: JDBC statements executed and the time spent in them
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.session.metrics=DEBUG
