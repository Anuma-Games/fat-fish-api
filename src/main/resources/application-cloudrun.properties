# Perfil "cloudrun": API en Cloud Run conectada a Cloud SQL con el conector de Google (sin IPs autorizadas).
# DB_URL, DB_USER y DB_PASSWORD llegan por variables de entorno y Secret Manager (ver application.properties).
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
# Cloud Run termina el TLS; sin esto Swagger genera URLs http://
server.forward-headers-strategy=framework
server.shutdown=graceful