# "gcp" profile: test database in Google Cloud SQL.
# DB_HOST, DB_NAME, DB_USER and DB_PASSWORD come from the .env file (never committed) or from environment variables.
# Flyway creates and updates the schema in Cloud SQL; Hibernate validates it like in the other profiles.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME:fatfish}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
