spring.application.name=fat-fish-api

# Database (defaults match docker-compose.yml for local development)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fatfish}
spring.datasource.username=${DB_USER:fatfish}
spring.datasource.password=${DB_PASSWORD:fatfish}

# Schema is owned by Flyway; Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
