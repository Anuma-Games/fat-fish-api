# "test" profile: integration tests against a real PostgreSQL.
# The connection comes from environment variables (CI sets them; locally the defaults
# point to the fatfish_test database created by docker-compose).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fatfish_test}
spring.datasource.username=${DB_USER:fatfish}
spring.datasource.password=${DB_PASSWORD:fatfish}
