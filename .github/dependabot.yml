# Revisa cada semana si hay versiones nuevas de las dependencias y abre un PR hacia develop.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    # El proyecto usa Java 21 (pom.xml, CI y arquitectura): solo parches y versiones menores de la imagen.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]
    commit-message:
      prefix: deps
