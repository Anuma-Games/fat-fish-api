name: CI

on:
  push:
    branches: [main, develop]
  # develop is included so its required status checks can run on Pull Requests
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y probar
    # Pinned instead of ubuntu-latest so the runner image changes only when we decide
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fatfish_test
          POSTGRES_USER: fatfish
          POSTGRES_PASSWORD: fatfish
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fatfish -d fatfish_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Read by the "test" Spring profile (src/test/resources/application-test.properties)
    env:
      DB_URL: jdbc:postgresql://localhost:5432/fatfish_test
      DB_USER: fatfish
      DB_PASSWORD: fatfish

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Java 21 (Temurin) con caché de Maven
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Dar permisos de ejecución a Maven Wrapper
        run: chmod +x mvnw

      - name: Pruebas (unitarias, controller e integración)
        run: ./mvnw -B test

      - name: Resumen de pruebas
        if: always()
        run: python3 .github/scripts/test_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Empaquetar
        run: ./mvnw -B package -DskipTests

      - name: Subir artefacto (.jar)
        uses: actions/upload-artifact@v7
        with:
          name: fat-fish-api-jar
          path: target/*.jar
          if-no-files-found: error

      - name: Subir reportes de pruebas (surefire)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn

  docker:
    name: Construir imagen Docker
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Validates the multi-stage Dockerfile; the image is not published yet
      - name: Construir imagen
        run: docker build --tag fat-fish-api:${{ github.sha }} .

      - name: Resumen de la imagen
        run: |
          {
            echo "## Imagen Docker"
            echo
            echo "| Imagen | Tamaño |"
            echo "|---|---|"
            docker image ls fat-fish-api:${{ github.sha }} --format '| `{{.Repository}}:{{.Tag}}` | {{.Size}} |'
          } >> "$GITHUB_STEP_SUMMARY"
